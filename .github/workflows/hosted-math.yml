name: Hosted mathematics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Install isolated capture dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/purity-hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/purity-hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture representative source pages
        env:
          NODE_PATH: ${{ runner.temp }}/purity-hosted-deps/node_modules
        run: |
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/purity-hosted-evidence" \
            --page README.md \
            --page science/model.md \
            --page science/measurement_resources.md
      - name: Retain the report and actual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ env.SOURCE_REVISION }}
          path: ${{ runner.temp }}/purity-hosted-evidence
          if-no-files-found: error
          retention-days: 14
